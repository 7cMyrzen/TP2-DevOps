services:
  db_mongo:
    build:
      context: ./mongo
      dockerfile: Dockerfile

    container_name: db_mongo

    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}

    volumes:
      - mongo_data:/data/db
      - ./mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro

    restart: on-failure

    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' -u $${MONGO_INITDB_ROOT_USERNAME} -p $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


  db_mysql:
    image: mysql:8.0

    container_name: db_mysql

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    volumes:
      - ./sqlfiles:/docker-entrypoint-initdb.d
      - mysql_data:/var/lib/mysql

    restart: on-failure

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  admin_mongo:
    image: mongo-express

    container_name: admin_mongo

    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017/
      ME_CONFIG_BASICAUTH: "false"

    ports:
      - "8081:8081"

    depends_on:
      db_mongo:
        condition: service_healthy

    restart: on-failure


  admin_mysql:
    image: adminer:4.8.1

    container_name: admin_mysql

    ports:
      - "8080:8080"

    depends_on:
      db_mysql:
        condition: service_healthy

    restart: on-failure


  api:
    build:
      context: ./api
      dockerfile: Dockerfile

    container_name: api

    environment:
      MONGO_URL: mongodb://${MONGO_INITDB_ROOT_USERNAME}:${MONGO_INITDB_ROOT_PASSWORD}@db_mongo:27017/
      MYSQL_HOST: db_mysql
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}

    ports:
      - "8000:8000"

    volumes:
      - ./api:/app

    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

    depends_on:
      db_mongo:
        condition: service_healthy
      db_mysql:
        condition: service_healthy

    restart: on-failure

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/posts || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s


volumes:
  mongo_data:
  mysql_data:
